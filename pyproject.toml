[project]
name = "ncp-screen"
version = "0.1.0"
description = "Dual-LLM title/abstract screening of OpenAlex records for IPBES NCP assessments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.60",
    "pandas>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
ncp-screen = "ncp_screen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncp_screen"]
